name: mongobox
description: "A new Flutter project."

# Remove this if you plan to publish to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  http: ^1.4.0
  cupertino_icons: ^1.0.8
  youtube_player_flutter: ^9.1.3
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  mobile_scanner: ^7.1.4
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_database: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  build_web_compilers: ^4.0.4
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-Bold.ttf
          weight: 700

  uses-material-design: true