name: mongobox
description: "A new Flutter project."

# Remove this if you plan to publish to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  http: ^1.4.0
  cupertino_icons: ^1.0.8
  youtube_player_flutter: ^9.1.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  just_audio: ^0.9.40
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  youtube_explode_dart: ^2.3.10
  record: ^5.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  mobile_scanner: ^7.1.4
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_database: ^11.0.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^8.0.2
  flutter_twemoji: ^1.1.0
  volume_controller: ^3.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  build_web_compilers: ^4.0.4
  flutter_lints: ^5.0.0

dependency_overrides:
  # Workaround for a pub.dev version skew where `record_linux` 0.7.2 is not yet
  # compatible with `record_platform_interface` 1.5.x (breaks iOS/Android builds
  # because Flutter compiles plugin Dart code for all platforms).
  record_linux:
    path: packages/record_linux

flutter:
  assets:
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-Bold.ttf
          weight: 700

  uses-material-design: true
