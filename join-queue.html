<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyricQsk • Join Queue</title>
  <style>
    :root {
      --primary: #d32f2f;
      --surface: #121212;
      --on-surface: #e0e0e0;
      --card: #1e1e1e;
      --success: #7c5cff;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2c3e50, #4a235a);
      color: var(--on-surface);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { text-align: center; margin: 24px 0; font-weight: 700; }
    .search-box {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
    }
    .song-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .thumbnail { width: 48px; height: 48px; background: #333; border-radius: 4px; }
    .song-info { flex: 1; }
    .add-btn {
      background: var(--success);
      padding: 6px 12px;
      font-size: 12px;
    }
    .section-title { margin-top: 32px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🎵 LyricQsk</h1>
  <p style="text-align:center; opacity:0.9">Join the music queue — search and suggest songs. No sign-in.</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search songs (any language)..." />
    <button onclick="searchSongs()">Search</button>
  </div>

  <div id="results"></div>

  <div class="section-title">Your Suggestions</div>
  <div id="suggestions"></div>

  <script>
    // Mock search (replace with real YouTube Data API later)
    function searchSongs() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const results = document.getElementById('results');
      results.innerHTML = `
        <div class="song-item">
          <div class="thumbnail"></div>
          <div class="song-info">
            <div><strong>${q} (Demo)</strong></div>
            <div style="font-size:14px; opacity:0.7">Artist Name</div>
          </div>
          <button class="add-btn" onclick="addToQueue('demo1')">Add</button>
        </div>
        <div class="song-item">
          <div class="thumbnail"></div>
          <div class="song-info">
            <div><strong>Another ${q}</strong></div>
            <div style="font-size:14px; opacity:0.7">Band X</div>
          </div>
          <button class="add-btn" onclick="addToQueue('demo2')">Add</button>
        </div>
      `;
    }

    function addToQueue(id) {
      let queue = JSON.parse(localStorage.getItem('mongobox_suggestions') || '[]');
      const song = { id, title: "Demo Song", artist: "Unknown", addedAt: Date.now() };
      queue.unshift(song); // add to top
      queue = queue.slice(0, 20); // cap at 20
      localStorage.setItem('mongobox_suggestions', JSON.stringify(queue));
      renderSuggestions();
    }

    function renderSuggestions() {
      const list = document.getElementById('suggestions');
      const queue = JSON.parse(localStorage.getItem('mongobox_suggestions') || '[]');
      list.innerHTML = queue.length
        ? queue.map(s => `<div class="song-item">
            <div class="thumbnail"></div>
            <div class="song-info"><div>${s.title}</div><div style="opacity:0.7">${s.artist}</div></div>
            <button class="add-btn" disabled>Added</button>
          </div>`).join('')
        : '<p style="text-align:center; padding:20px; opacity:0.7">No suggestions yet. Search and add songs!</p>';
    }

    renderSuggestions();
  </script>
</body>
</html>
