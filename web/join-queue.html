<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MongoBox • Join Queue</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f8f9fa; }
    h1 { color: #d32f2f; text-align: center; }
    input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background: #d32f2f; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .results { margin-top: 20px; }
    .song { padding: 10px; border-bottom: 1px solid #eee; }
    #status { color: green; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎵 MongoBox</h1>
  <p style="text-align:center">Join the music queue — search and suggest songs. No sign-in.</p>

  <div>
    <input type="text" id="query" placeholder="Search songs..." />
    <button onclick="search()">Search</button>
  </div>

  <div class="results" id="results"></div>
  <div id="status"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    // Wait for Flutter to initialize Firebase
    window.addEventListener('load', function() {
      // Use the Firebase instance from Flutter
      const db = firebase.database();
      
      window.search = async function() {
        const q = document.getElementById('query').value.trim();
        if (!q) return;
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(q)}&type=video&key=AIzaSyBJzIb7YbZPPL2XuOGlncntEPwkc0JQpmY`);
        const data = await res.json();
        const html = data.items.map(item => `
          <div class="song">
            <img src="${item.snippet.thumbnails.default.url}" width="48" height="48" style="vertical-align:middle; margin-right:10px;">
            <strong>${item.snippet.title}</strong><br>
            <small>${item.snippet.channelTitle}</small><br>
            <button onclick='addToQueue("${item.id.videoId}", "${item.snippet.title.replace(/"/g, '\\"')}", "${item.snippet.channelTitle.replace(/"/g, '\\"')}")'>Add to Queue</button>
          </div>
        `).join('');
        document.getElementById('results').innerHTML = html;
      };

      window.addToQueue = function(id, title, artist) {
        db.ref('queue').push({
          id: id,
          title: title,
          artist: artist,
          thumbnail: `https://i.ytimg.com/vi/${id}/default.jpg`
        });
        document.getElementById('status').innerText = '✅ Added to queue!';
        setTimeout(() => document.getElementById('status').innerText = '', 2000);
      };
    });
  </script>
</body>
</html>
