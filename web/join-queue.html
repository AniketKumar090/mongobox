<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MongoBox • Join Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F3EF;
      --surface: #F8F4EE;
      --card: #F0EDE7;
      --border: #D8D4CC;
      --border-light: #EAE6E0;
      --text-primary: #111111;
      --text-secondary: #575757;
      --text-muted: #AAAAAA;
      --accent-green: #11F08A;
      --accent-green-dim: rgba(17,240,138,0.15);
      --black: #171717;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 0;
      color: var(--text-primary);
    }

    .screen {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 0 20px 24px;
    }

    /* ── Top safe area ── */
    .safe-top { height: 52px; }

    /* ── Header / Party Banner ── */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.05;
    }
    .header-menu-btn {
      height: 32px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .header-menu-btn:hover { background: var(--card); }
    .header-menu-btn svg { width: 18px; height: 18px; color: #333; }

    .header-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 14px;
    }

    /* ── Party Banner ── */
    .party-banner {
      background: var(--black);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: none;
    }
    .party-banner.visible { display: block; }
    .party-banner-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .party-banner-id {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.02em;
    }

    /* ── Search Input ── */
    .search-container {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      display: flex;
      align-items: center;
      padding: 0 10px 0 14px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .search-container:focus-within {
      border-color: var(--accent-green);
    }
    .search-icon {
      width: 20px;
      height: 20px;
      color: #555;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      padding: 16px 10px;
      outline: none;
    }
    .search-input::placeholder {
      font-weight: 500;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── Action Row ── */
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-find {
      flex: 1;
      height: 52px;
      background: var(--black);
      color: #fff;
      border: none;
      border-radius: 26px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    .btn-find:hover { opacity: 0.85; }
    .btn-find:disabled { background: #333; color: #888; cursor: not-allowed; }
    .btn-find svg { width: 18px; height: 18px; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results List ── */
    .results-section { flex: 1; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 14px;
    }
    .empty-icon {
      width: 52px; height: 52px;
      background: var(--card);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
    }
    .empty-icon svg { width: 22px; height: 22px; color: #888; }
    .empty-text {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      text-align: center;
    }

    /* ── Song Card ── */
    .song-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      transition: background 0.15s;
    }
    .song-card:hover { background: var(--card); }

    .song-thumb {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--card);
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 12px;
      font-weight: 600;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-add {
      height: 36px;
      padding: 0 16px;
      border-radius: 18px;
      background: var(--black);
      color: #fff;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-add:hover { background: #333; }
    .btn-add:active { transform: scale(0.96); }
    .btn-add.added {
      background: #11C979;
      color: #fff;
      pointer-events: none;
    }
    .btn-add svg { width: 14px; height: 14px; }

    /* ── Trending Section ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-label-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .section-label-badge {
      height: 20px;
      padding: 0 8px;
      background: var(--black);
      color: #fff;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
    }
    .trending-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .trending-scroll::-webkit-scrollbar { display: none; }

    .trending-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      max-width: 200px;
    }
    .trending-chip:hover { background: var(--card); border-color: var(--border); }
    .trending-chip:active { transform: scale(0.97); }

    .trending-chip-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--card);
    }
    .trending-chip-info { min-width: 0; }
    .trending-chip-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }
    .trending-chip-artist {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
      margin-top: 2px;
    }
    .trending-rank {
      font-size: 10px;
      font-weight: 900;
      color: var(--accent-green);
      margin-right: -2px;
      flex-shrink: 0;
    }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border-light); }
    .divider-text { font-size: 11px; font-weight: 700; color: #AAA; }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: calc(100% - 48px);
      max-width: 382px;
    }
    .toast {
      background: #F8F4EE;
      border-radius: 24px;
      border: 1.4px solid;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      width: 100%;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: #7BE7BE; }
    .toast.error { border-color: #E47A7A; }
    .toast-dot {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .toast.success .toast-dot { background: rgba(123,231,190,0.16); }
    .toast.error .toast-dot { background: rgba(228,122,122,0.16); }
    .toast-dot svg { width: 18px; height: 18px; }
    .toast.success .toast-dot svg { color: #11C979; }
    .toast.error .toast-dot svg { color: #B54545; }
    .toast-msg {
      font-size: 14px;
      font-weight: 700;
      color: #111;
      line-height: 1.35;
      padding-top: 6px;
    }
  </style>
</head>
<body>

<div class="screen">
  <div class="safe-top"></div>

  <!-- Header -->
  <div class="header-row">
    <div class="header-title">Add to the queue</div>
  </div>
  <div class="header-subtitle">Search a song and drop it in the party.</div>

  <!-- Party Banner -->
  <div class="party-banner" id="party-banner">
    <div class="party-banner-label">🎪 Connected to party</div>
    <div class="party-banner-id" id="party-id-label"></div>
  </div>

  <!-- Search -->
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      class="search-input"
      id="query"
      type="text"
      placeholder="e.g. Kishore Kumar"
      autocomplete="off"
      onkeypress="if(event.key==='Enter') search()"
    />
  </div>

  <!-- Action -->
  <div class="action-row">
    <button class="btn-find" id="search-btn" onclick="search()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Find &amp; add
    </button>
  </div>

  <!-- Trending -->
  <div id="trending-section">
    <div class="section-label">
      <div class="section-label-text">Trending now</div>
      <div class="section-label-badge">🔥 Hot</div>
    </div>
    <div class="trending-scroll" id="trending-scroll">
      <!-- filled by JS -->
    </div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or search below</div>
      <div class="divider-line"></div>
    </div>
  </div>

  <!-- Results -->
  <div class="results-section" id="results"></div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const partyId = urlParams.get('partyId') || 'default_party';

  if (partyId && partyId !== 'default_party') {
    document.getElementById('party-banner').classList.add('visible');
    document.getElementById('party-id-label').textContent = partyId;
  }

  const firebaseConfig = {
    apiKey: "AIzaSyCTMwHxyQVJb_0l39uMKIqka-pGYszGexw",
    authDomain: "mongobox-79a1f.firebaseapp.com",
    projectId: "mongobox-79a1f",
    storageBucket: "mongobox-79a1f.firebasestorage.app",
    messagingSenderId: "850327601337",
    appId: "1:850327601337:web:97b8ca86cfda6b37e89b68",
    databaseURL: "https://mongobox-79a1f-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ── Trending songs (curated popular tracks) ───────────────────────────────
  const TRENDING = [
    { id: 'JGwWNGJdvx8', title: 'Shape of You', artist: 'Ed Sheeran' },
    { id: 'ktvTqknDobU', title: 'Rockstar', artist: 'Ap Dhillon' },
    { id: 'ru0K8uYEZWw', title: 'Calm Down', artist: 'Rema & Selena Gomez' },
    { id: '09R8_2nJtjg', title: 'Sunflower', artist: 'Post Malone' },
    { id: 'SlPhMPnQ58k', title: 'Kesariya', artist: 'Arijit Singh' },
    { id: 'nfWlot6h_JM', title: 'Shake It Off', artist: 'Taylor Swift' },
    { id: 'YqeW9_5kURI', title: 'Perfect', artist: 'Ed Sheeran' },
    { id: '2Vv-BfVoq4g', title: 'Perfect (Live)', artist: 'Ed Sheeran' },
    { id: 'OPf0YbXqDm0', title: 'Uptown Funk', artist: 'Bruno Mars' },
    { id: 'hT_nvWreIhg', title: 'Counting Stars', artist: 'OneRepublic' },
  ];

  function buildTrendingChips() {
    const container = document.getElementById('trending-scroll');
    container.innerHTML = TRENDING.map((s, i) => `
      <div class="trending-chip" onclick="addTrending('${s.id}','${s.title.replace(/'/g,"\\'")}','${s.artist.replace(/'/g,"\\'")}',this)">
        <span class="trending-rank">#${i + 1}</span>
        <img class="trending-chip-thumb"
          src="https://i.ytimg.com/vi/${s.id}/default.jpg"
          alt=""
          onerror="this.style.background='#E8E3DC'"
        >
        <div class="trending-chip-info">
          <div class="trending-chip-title">${s.title}</div>
          <div class="trending-chip-artist">${s.artist}</div>
        </div>
      </div>
    `).join('');
  }

  window.addTrending = function(id, title, artist, chipEl) {
    chipEl.style.opacity = '0.5';
    chipEl.style.pointerEvents = 'none';
    db.ref(`parties/${partyId}/queue`).push({
      id, title, artist,
      thumbnail: `https://i.ytimg.com/vi/${id}/default.jpg`,
      addedAt: new Date().toISOString()
    }).then(() => {
      showToast(`"${title}" added to queue!`);
      chipEl.style.border = '1.5px solid #11C979';
      chipEl.style.opacity = '0.6';
    }).catch(() => {
      showToast('Could not add song. Try again.', 'error');
      chipEl.style.opacity = '1';
      chipEl.style.pointerEvents = 'auto';
    });
  };

  function showToast(message, type = 'success') {
    const wrap = document.getElementById('toast-wrap');
    const icon = type === 'success'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<div class="toast-dot">${icon}</div><div class="toast-msg">${message}</div>`;
    wrap.appendChild(t);
    requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 350);
    }, 3500);
  }

  window.search = async function() {
    const q = document.getElementById('query').value.trim();
    if (!q) { showToast('Type something to search.', 'error'); return; }

    // Hide trending when user searches
    document.getElementById('trending-section').style.display = 'none';

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.innerHTML = `<div class="spinner"></div> Finding…`;

    try {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(q)}&type=video&key=AIzaSyBJzIb7YbZPPL2XuOGlncntEPwkc0JQpmY`);
      const data = await res.json();

      if (!data.items || data.items.length === 0) {
        showToast('No songs found. Try different keywords.', 'error');
        document.getElementById('results').innerHTML = `<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="empty-text">No results found.<br>Try a different search.</div></div>`;
        return;
      }

      const html = data.items.map(item => {
        const safeTitle = item.snippet.title.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const safeArtist = item.snippet.channelTitle.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        return `
          <div class="song-card">
            <img class="song-thumb" src="${item.snippet.thumbnails.default.url}" alt="" onerror="this.style.background='#E8E3DC'">
            <div class="song-info">
              <div class="song-title">${item.snippet.title}</div>
              <div class="song-artist">${item.snippet.channelTitle}</div>
            </div>
            <button class="btn-add" onclick='addToQueue("${item.id.videoId}", "${safeTitle}", "${safeArtist}", this)'>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add
            </button>
          </div>`;
      }).join('');

      document.getElementById('results').innerHTML = html;

    } catch (e) {
      showToast('Search failed. Check your connection.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Find &amp; add`;
    }
  };

  window.addToQueue = function(id, title, artist, btn) {
    btn.disabled = true;
    btn.innerHTML = `<div class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3);width:12px;height:12px;"></div>`;

    db.ref(`parties/${partyId}/queue`).push({
      id, title, artist,
      thumbnail: `https://i.ytimg.com/vi/${id}/default.jpg`,
      addedAt: new Date().toISOString()
    }).then(() => {
      showToast(`"${title}" added to queue!`);
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg> Added`;
      btn.classList.add('added');
    }).catch(err => {
      showToast('Could not add song. Try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Retry`;
    });
  };

  window.addEventListener('load', () => {
    buildTrendingChips();
    document.getElementById('query').focus();
  });
</script>
</body>
</html>
