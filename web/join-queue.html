<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MongoBox • Join Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #d32f2f;
      --surface: #121212;
      --on-surface: #e0e0e0;
      --card: #1e1e1e;
      --success: #4caf50;
      --border: #333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2c3e50, #4a235a);
      color: var(--on-surface);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin: 24px 0 8px;
      font-weight: 700;
      font-size: 1.5rem;
    }
    p.subtitle {
      text-align: center;
      opacity: 0.9;
      margin-bottom: 24px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 16px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }
    .song-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .thumbnail {
      width: 48px;
      height: 48px;
      background: #333;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .song-info strong { display: block; font-weight: 600; }
    .song-info small { display: block; font-size: 14px; opacity: 0.7; }
    .add-btn {
      background: var(--success);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .section-title {
      margin-top: 32px;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .empty {
      text-align: center;
      padding: 32px 16px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>🎵 MongoBox</h1>
  <p class="subtitle">Join the music queue — search and suggest songs. No sign-in.</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search songs (any language)..." />
    <button onclick="searchSongs()">Search</button>
  </div>

  <div id="results"></div>

  <div class="section-title">Your Suggestions</div>
  <div id="suggestions"></div>

  <script>
    function searchSongs() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const results = document.getElementById('results');
      results.innerHTML = `
        <div class="song-item">
          <div class="thumbnail"></div>
          <div class="song-info">
            <strong>${q} (Demo)</strong>
            <small>Artist Name</small>
          </div>
          <button class="add-btn" onclick="addToQueue('demo1')">Add</button>
        </div>
        <div class="song-item">
          <div class="thumbnail"></div>
          <div class="song-info">
            <strong>Another ${q}</strong>
            <small>Band X</small>
          </div>
          <button class="add-btn" onclick="addToQueue('demo2')">Add</button>
        </div>
      `;
    }

    function addToQueue(id) {
      let queue = JSON.parse(localStorage.getItem('mongobox_suggestions') || '[]');
      const song = { id, title: "Demo Song", artist: "Unknown", addedAt: Date.now() };
      queue.unshift(song);
      queue = queue.slice(0, 20);
      localStorage.setItem('mongobox_suggestions', JSON.stringify(queue));
      renderSuggestions();
    }

    function renderSuggestions() {
      const list = document.getElementById('suggestions');
      const queue = JSON.parse(localStorage.getItem('mongobox_suggestions') || '[]');
      if (queue.length === 0) {
        list.innerHTML = '<div class="empty">No suggestions yet. Search and add songs!</div>';
        return;
      }
      list.innerHTML = queue.map(s => `
        <div class="song-item">
          <div class="thumbnail"></div>
          <div class="song-info">
            <strong>${s.title}</strong>
            <small>${s.artist}</small>
          </div>
          <button class="add-btn" disabled>Added</button>
        </div>
      `).join('');
    }

    renderSuggestions();
  </script>
</body>
</html>
